# Render Blueprint — Kaguera backend (FastAPI).
#
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# Render prompts for the two `sync: false` values below; paste them there.
#
# The database is NOT provisioned here. Render's free Postgres expires after
# ~30 days, which would silently break the portfolio mid-job-hunt, so the app
# points at a Neon free database instead (no expiry, scales to zero when idle).
# Keep Neon and this service in the same region to minimise API↔DB latency.

services:
  - type: web
    name: kaguera-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      # Neon connection string (postgresql://user:pass@host/db?sslmode=require).
      # The app rewrites the scheme to psycopg v3 at startup (see core/config.py).
      - key: DATABASE_URL
        sync: false
      # Browser origin allowed by CORS — the public Vercel URL, no trailing
      # slash. Set once Vercel has assigned the domain; comma-separate to add
      # more (e.g. a custom domain).
      - key: CORS_ORIGINS
        sync: false
